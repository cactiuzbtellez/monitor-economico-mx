name: Fetch RSS Noticias Económicas

on:
  schedule:
    - cron: '0 * * * *'   # Cada hora en punto
  workflow_dispatch:        # También se puede correr manualmente

jobs:
  fetch-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Fetch RSS feeds
        run: python scripts/fetch_rss.py

      - name: Commit & push noticias.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/noticias.json
          git diff --cached --quiet || git commit -m "chore: actualizar noticias $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
