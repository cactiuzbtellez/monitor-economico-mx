<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor Económico MX</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* ── Variables ─────────────────────────────────────── */
  :root {
    --bg:        #08090d;
    --surface:   #0f1117;
    --border:    #1e2130;
    --border-hi: #2d3352;
    --text:      #c9cfe0;
    --text-dim:  #5a6282;
    --text-hi:   #eef0f8;
    --accent-r:  #c8102e;
    --accent-o:  #e87722;
    --accent-g:  #00c896;
    --accent-b:  #3d78f5;
    --mono:      'Space Mono', monospace;
    --sans:      'DM Sans', sans-serif;
    --ticker-h:  36px;
    --header-h:  56px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    height: 100%;
    overflow-x: hidden;
  }

  /* ── Ticker tape ────────────────────────────────────── */
  .ticker-wrap {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--ticker-h);
    background: #010204;
    border-bottom: 1px solid var(--accent-b);
    overflow: hidden;
    z-index: 100;
    display: flex;
    align-items: center;
  }
  .ticker-label {
    flex-shrink: 0;
    padding: 0 16px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent-b);
    letter-spacing: 2px;
    border-right: 1px solid var(--border-hi);
    height: 100%;
    display: flex;
    align-items: center;
    background: #010204;
    z-index: 2;
  }
  .ticker-track {
    display: flex;
    white-space: nowrap;
    animation: ticker 60s linear infinite;
  }
  .ticker-track:hover { animation-play-state: paused; }
  .ticker-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 32px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    border-right: 1px solid var(--border);
  }
  .ticker-item .tag {
    color: var(--accent-b);
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .ticker-title { color: var(--text); max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  @keyframes ticker {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* ── Header ─────────────────────────────────────────── */
  header {
    position: fixed;
    top: var(--ticker-h);
    left: 0; right: 0;
    height: var(--header-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 90;
  }
  .logo {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    color: var(--text-hi);
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent-b); }
  .header-meta {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    text-align: right;
    line-height: 1.6;
  }
  #reloj { color: var(--accent-g); }

  /* ── Layout ─────────────────────────────────────────── */
  main {
    padding-top: calc(var(--ticker-h) + var(--header-h) + 20px);
    padding-bottom: 40px;
    max-width: 1400px;
    margin: 0 auto;
    padding-left: 20px;
    padding-right: 20px;
  }

  /* ── Filtros ─────────────────────────────────────────── */
  .filtros {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    align-items: center;
  }
  .filtros-label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-right: 4px;
  }
  .filtro-btn {
    padding: 5px 14px;
    border: 1px solid var(--border-hi);
    background: transparent;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all .15s;
    text-transform: uppercase;
  }
  .filtro-btn:hover, .filtro-btn.active {
    border-color: var(--accent-b);
    color: var(--accent-b);
    background: rgba(61,120,245,.08);
  }
  .filtro-btn[data-fuente="El Financiero"].active { border-color: var(--accent-r); color: var(--accent-r); background: rgba(200,16,46,.08); }
  .filtro-btn[data-fuente="El Economista"].active  { border-color: var(--accent-o); color: var(--accent-o); background: rgba(232,119,34,.08); }

  /* ── Grid de cards ───────────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
  }

  /* ── Card ────────────────────────────────────────────── */
  .card {
    background: var(--surface);
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    overflow: hidden;
    transition: background .15s;
    cursor: pointer;
    text-decoration: none;
  }
  .card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--card-accent, var(--border-hi));
    transition: width .2s;
  }
  .card:hover { background: #13161f; }
  .card:hover::before { width: 5px; }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-fuente {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--card-accent, var(--text-dim));
    font-weight: 700;
  }
  .card-sep { color: var(--border-hi); font-size: 10px; }
  .card-seccion {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-dim);
    background: var(--bg);
    padding: 2px 7px;
    border: 1px solid var(--border-hi);
  }

  .card-titulo {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    color: var(--text-hi);
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-resumen {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 2px;
  }
  .card-fecha {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }
  .card-link-icon {
    font-size: 10px;
    color: var(--text-dim);
    opacity: 0;
    transition: opacity .15s;
  }
  .card:hover .card-link-icon { opacity: 1; }

  /* ── Estado vacío / carga ────────────────────────────── */
  .estado {
    grid-column: 1/-1;
    padding: 60px 20px;
    text-align: center;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
  }
  .estado .dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--accent-g);
    border-radius: 50%;
    animation: pulse 1s infinite;
    margin-right: 8px;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: .4; transform: scale(.7); }
  }

  /* ── Resumen stats ───────────────────────────────────── */
  .stats-bar {
    display: flex;
    gap: 24px;
    margin-bottom: 16px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 10px;
    flex-wrap: wrap;
  }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-val { font-size: 18px; color: var(--text-hi); font-weight: 700; }
  .stat-lbl { color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; font-size: 9px; }

  /* ── Scrollbar ───────────────────────────────────────── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-hi); }
</style>
</head>
<body>

<!-- TICKER -->
<div class="ticker-wrap">
  <div class="ticker-label">MONITOR MX</div>
  <div class="ticker-track" id="tickerTrack">
    <span class="ticker-item"><span class="tag">Cargando…</span></span>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">MONITOR <span>//</span> ECO·MX</div>
  <div class="header-meta">
    <div id="reloj">--:--:-- UTC</div>
    <div id="ultima-act">Última actualización: –</div>
  </div>
</header>

<!-- MAIN -->
<main>
  <!-- Stats -->
  <div class="stats-bar" id="statsBar">
    <div class="stat"><div class="stat-val" id="statTotal">–</div><div class="stat-lbl">Noticias</div></div>
    <div class="stat"><div class="stat-val" id="statFin" style="color:var(--accent-r)">–</div><div class="stat-lbl">El Financiero</div></div>
    <div class="stat"><div class="stat-val" id="statEco" style="color:var(--accent-o)">–</div><div class="stat-lbl">El Economista</div></div>
    <div class="stat"><div class="stat-val" id="statSec">–</div><div class="stat-lbl">Secciones</div></div>
  </div>

  <!-- Filtros -->
  <div class="filtros">
    <span class="filtros-label">FILTRAR:</span>
    <button class="filtro-btn active" data-fuente="TODOS">Todos</button>
    <button class="filtro-btn" data-fuente="El Financiero">El Financiero</button>
    <button class="filtro-btn" data-fuente="El Economista">El Economista</button>
  </div>

  <!-- Grid -->
  <div class="grid" id="grid">
    <div class="estado"><span class="dot"></span>Cargando noticias…</div>
  </div>
</main>

<script>
// ── Reloj ──────────────────────────────────────────────────────────────────
function actualizarReloj() {
  const ahora = new Date();
  document.getElementById('reloj').textContent =
    ahora.toUTCString().slice(17, 25) + ' UTC';
}
actualizarReloj();
setInterval(actualizarReloj, 1000);

// ── Estado global ──────────────────────────────────────────────────────────
let todasLasNoticias = [];
let filtroActual = 'TODOS';

// ── Colores por fuente ─────────────────────────────────────────────────────
const COLORES = {
  'El Financiero': '#C8102E',
  'El Economista': '#E87722',
};

// ── Render cards ───────────────────────────────────────────────────────────
function renderGrid(noticias) {
  const grid = document.getElementById('grid');
  if (!noticias.length) {
    grid.innerHTML = '<div class="estado">Sin noticias para este filtro.</div>';
    return;
  }
  grid.innerHTML = noticias.map(n => {
    const color = COLORES[n.fuente] || '#3d78f5';
    return `
      <a class="card" href="${n.link}" target="_blank" rel="noopener"
         style="--card-accent:${color}">
        <div class="card-meta">
          <span class="card-fuente">${n.fuente}</span>
          <span class="card-sep">·</span>
          <span class="card-seccion">${n.seccion}</span>
        </div>
        <div class="card-titulo">${n.titulo}</div>
        ${n.resumen ? `<div class="card-resumen">${n.resumen}</div>` : ''}
        <div class="card-footer">
          <span class="card-fecha">${n.fecha || ''}</span>
          <span class="card-link-icon">↗</span>
        </div>
      </a>`;
  }).join('');
}

// ── Ticker ─────────────────────────────────────────────────────────────────
function renderTicker(noticias) {
  const items = noticias.slice(0, 30).map(n =>
    `<span class="ticker-item">
       <span class="tag">${n.fuente.replace('El ', '')}</span>
       <span class="ticker-title">${n.titulo}</span>
     </span>`
  ).join('');
  // Duplicar para loop continuo
  document.getElementById('tickerTrack').innerHTML = items + items;
}

// ── Stats ──────────────────────────────────────────────────────────────────
function renderStats(noticias, meta) {
  const fin = noticias.filter(n => n.fuente === 'El Financiero').length;
  const eco = noticias.filter(n => n.fuente === 'El Economista').length;
  const sec = [...new Set(noticias.map(n => n.seccion))].length;
  document.getElementById('statTotal').textContent = noticias.length;
  document.getElementById('statFin').textContent   = fin;
  document.getElementById('statEco').textContent   = eco;
  document.getElementById('statSec').textContent   = sec;
  if (meta?.actualizado)
    document.getElementById('ultima-act').textContent = 'Actualizado: ' + meta.actualizado;
}

// ── Filtros ────────────────────────────────────────────────────────────────
document.querySelectorAll('.filtro-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filtroActual = btn.dataset.fuente;
    const filtradas = filtroActual === 'TODOS'
      ? todasLasNoticias
      : todasLasNoticias.filter(n => n.fuente === filtroActual);
    renderGrid(filtradas);
  });
});

// ── Fetch JSON ─────────────────────────────────────────────────────────────
async function cargarNoticias() {
  try {
    const res = await fetch('data/noticias.json?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const datos = await res.json();
    todasLasNoticias = datos.noticias || [];

    renderStats(todasLasNoticias, datos);
    renderTicker(todasLasNoticias);
    renderGrid(todasLasNoticias);
  } catch (e) {
    document.getElementById('grid').innerHTML =
      `<div class="estado">⚠ No se pudo cargar noticias.json<br><small>${e.message}</small></div>`;
    console.error(e);
  }
}

cargarNoticias();
// Auto-refresh cada 15 minutos
setInterval(cargarNoticias, 15 * 60 * 1000);
</script>
</body>
</html>
